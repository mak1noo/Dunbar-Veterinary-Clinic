<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dunbar Veterinary Clinic — Appointment Book{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-name">Dunbar Veterinary Clinic</span>
        <span class="brand-sub">Appointment book</span>
      </div>
      <nav class="nav">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.farm_run') }}">Farm run</a>
        <a href="{{ url_for('clients.list_clients') }}">Clients</a>
        <a href="{{ url_for('consultations.new_consultation') }}">Book a consultation</a>
        <a href="{{ url_for('farm_visits.new_farm_visit') }}">Book a farm visit</a>
        <a href="{{ url_for('offline.offline_status') }}">Offline status</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>ISYS3001 team project · runs locally, no internet needed</span>
  </footer>
</body>
</html>
